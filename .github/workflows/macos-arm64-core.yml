# W5 of the macOS Apple Silicon port: LibRaw darwin/arm64 static build wired
# into the Go core, RGB Light Air serial on macOS, and the Go tests on macOS,
# Linux and Windows. Not a release: artifacts are test builds and logs.
name: macOS arm64 core (LibRaw + serial)
on:
  push:
    branches: [mac/w5-core-libraw-serial-arm64, mac/integration]
  workflow_dispatch:
permissions:
  contents: read
env:
  # Public-domain (CC0) Fujifilm X-T3 sample from raw.pixls.us for the decode check.
  SAMPLE_URL: https://raw.pixls.us/data/Fujifilm/X-T3/AFXT2721.RAF
  SAMPLE_SHA256: 95b33021160b239ceb1a09d46a1b29cb60cb7dd47581feb126b337c219091754
  SAMPLE: AFXT2721.RAF
jobs:
  libraw-darwin-arm64:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: uname -m; sw_vers; xcodebuild -version; clang --version
      - name: Build LibRaw 0.22.1 + zlib 1.3.1 (static, arm64, pinned sources)
        run: bash ci/macos/build_libraw.sh
      - name: Inspect
        run: |
          D=third_party/libraw/lib/darwin_arm64
          lipo -info $D/libraw.a $D/libz.a
          ls -l $D
      - uses: actions/upload-artifact@v4
        with:
          name: libraw-darwin-arm64
          path: |
            third_party/libraw/lib/darwin_arm64/libraw.a
            third_party/libraw/lib/darwin_arm64/libz.a
            third_party/libraw/lib/darwin_arm64/BUILDINFO.txt

  go-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Vet and test (all packages except the Win32 UI root)
        shell: bash
        run: |
          set -o pipefail
          PKGS=$(go list -e ./... 2>/dev/null | grep -v '^basetool$')
          go vet -composites=false $PKGS  # composites: pre-existing unkeyed literals in hdrscan tests
          go test -v -count=1 $PKGS 2>&1 | tee go-test-linux.log
      - name: Test summary
        if: always()
        shell: bash
        run: bash ci/macos/test_summary.sh go-test-linux.log linux/amd64 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: sample
          key: raw-sample-${{ env.SAMPLE_SHA256 }}
      - name: Decode the sample raw (vendored linux_amd64 LibRaw)
        shell: bash
        run: |
          bash ci/macos/fetch_sample.sh
          go build -o rawtest ./cmd/rawtest
          ./rawtest convert "sample/$SAMPLE"
          mkdir -p decode && mv "sample/$SAMPLE.tiff" decode/linux.tiff
          sha256sum decode/linux.tiff
      - uses: actions/upload-artifact@v4
        with:
          name: decode-linux
          path: decode/linux.tiff
          compression-level: 1
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-linux
          path: go-test-linux.log

  go-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build the Windows app (unchanged)
        shell: bash
        run: |
          gcc --version | head -1
          go build -ldflags="-H windowsgui" -o NegativeScanStudio.exe .
          ls -l NegativeScanStudio.exe
      - name: Vet and test (all packages)
        shell: bash
        run: |
          set -o pipefail
          go vet -composites=false $(go list -e ./... | grep -v '^basetool$')
          go test -v -count=1 ./... 2>&1 | tee go-test-windows.log
      - name: Test summary
        if: always()
        shell: bash
        run: bash ci/macos/test_summary.sh go-test-windows.log windows/amd64 | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/cache@v4
        with:
          path: sample
          key: raw-sample-${{ env.SAMPLE_SHA256 }}
      - name: Decode the sample raw (vendored windows_amd64 LibRaw)
        shell: bash
        run: |
          bash ci/macos/fetch_sample.sh
          go build -o rawtest.exe ./cmd/rawtest
          ./rawtest.exe convert "sample/$SAMPLE"
          mkdir -p decode && mv "sample/$SAMPLE.tiff" decode/windows.tiff
          sha256sum decode/windows.tiff
      - uses: actions/upload-artifact@v4
        with:
          name: decode-windows
          path: decode/windows.tiff
          compression-level: 1
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: go-test-windows
          path: go-test-windows.log

  go-darwin-arm64:
    needs: [libraw-darwin-arm64, go-linux, go-windows]
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v4
        with:
          name: libraw-darwin-arm64
          path: third_party/libraw/lib/darwin_arm64
      - name: Environment
        run: |
          uname -m; sw_vers; go version; go env GOOS GOARCH CGO_ENABLED
          cat third_party/libraw/lib/darwin_arm64/BUILDINFO.txt
      - name: Vet and test (cgo on, all packages except the Win32 UI root)
        run: |
          set -o pipefail
          PKGS=$(go list -e ./... 2>/dev/null | grep -v '^basetool$')
          go vet -composites=false $PKGS  # composites: pre-existing unkeyed literals in hdrscan tests
          go test -v -count=1 $PKGS 2>&1 | tee go-test-darwin.log
      - name: rgblight without cgo (ioreg enumerator)
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          CGO_ENABLED=0 go test -v -count=1 ./rgblight 2>&1 | tee go-test-darwin-nocgo.log
      - name: Test summary
        if: always()
        run: |
          bash ci/macos/test_summary.sh go-test-darwin.log "darwin/arm64 ${{ matrix.os }} (cgo)" | tee -a "$GITHUB_STEP_SUMMARY"
          bash ci/macos/test_summary.sh go-test-darwin-nocgo.log "darwin/arm64 ${{ matrix.os }} rgblight (no cgo)" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Build tools and list serial ports
        if: ${{ !cancelled() }}
        run: |
          mkdir -p out
          go build -o out/rgblightports ./cmd/rgblightports
          go build -o out/rawtest ./cmd/rawtest
          CGO_ENABLED=0 go build -o out/rgblightports-nocgo ./cmd/rgblightports
          file out/*
          echo "rawtest links (LibRaw must be static):"; otool -L out/rawtest
          if otool -L out/rawtest | grep -qi libraw; then echo "LibRaw linked dynamically"; exit 1; fi
          out/rgblightports | tee out/rgblightports.txt
          out/rgblightports -sim info status on all brightness g 33 off b setall 64 1 100 status | tee -a out/rgblightports.txt
          out/rgblightports-nocgo | tee -a out/rgblightports.txt
          ls -l /dev/cu.* /dev/tty.* 2>/dev/null | head -20 || true
      - name: W6 mactether (ImageCaptureCore), camera sims, CLI sims, real camera list
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          W=w6out
          mkdir -p "$W"
          # Camera package with cgo: ICC transport over the simulated X-T3, fuji_test, shutter_test.
          go test -v -count=1 ./camera 2>&1 | tee "$W/go-test-camera.log"
          bash ci/macos/test_summary.sh "$W/go-test-camera.log" "camera ${{ matrix.os }} (cgo, ICC sim + fuji/shutter)" | tee -a "$GITHUB_STEP_SUMMARY"
          go build -o "$W/mactether" ./cmd/mactether
          file "$W/mactether"
          otool -L "$W/mactether" | tee "$W/otool.txt"
          grep -q ImageCaptureCore.framework "$W/otool.txt"
          if grep -qi libraw "$W/otool.txt"; then echo "LibRaw linked dynamically"; exit 1; fi
          # Hard 120 s cap per run (macOS has no timeout(1)): a hung ImageCaptureCore wait fails the step.
          run() { perl -e 'alarm 120; exec @ARGV or die "exec: $!"' "$@"; }
          (
            cd "$W"
            run ./mactether -sim list
            run ./mactether -sim info
            run ./mactether -sim -n 20 lv sim_lv.jpg
            run ./mactether -sim capture sim_capture
            file sim_lv.jpg sim_capture/*
            head -c 15 sim_capture/mactether_DSCF0001.RAF | grep -q FUJIFILMCCD-RAW
            if run ./mactether bogus; then echo "unknown command accepted"; exit 1; fi
          ) 2>&1 | tee "$W/sim.txt"
          # Real ImageCaptureCore browse on a runner without a camera: must exit 0 and say so.
          (cd "$W" && run ./mactether -timeout 8s list) 2>&1 | tee "$W/real_list.txt"
          grep -Eq 'no cameras found|camera\(s\):' "$W/real_list.txt"
          # The artifact keeps the binary: the user can run this CI build on his Mac (see docs/MACTETHER.md).
          (cd "$W" && shasum -a 256 $(find . -type f ! -name SHA256SUMS.txt | sort) > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: w6-mactether-sim-${{ matrix.os }}
          path: w6out
      - uses: actions/cache@v4
        if: ${{ !cancelled() }}
        with:
          path: sample
          key: raw-sample-${{ env.SAMPLE_SHA256 }}
      - uses: actions/download-artifact@v4
        if: ${{ !cancelled() }}
        with:
          pattern: decode-*
          path: decode
          merge-multiple: true
      - name: Decode the sample raw and compare with Linux and Windows
        if: ${{ !cancelled() }}
        run: |
          set -o pipefail
          bash ci/macos/fetch_sample.sh
          /usr/bin/time -l out/rawtest convert "sample/$SAMPLE" 2>&1 | tee out/decode.txt
          mv "sample/$SAMPLE.tiff" decode/darwin.tiff
          shasum -a 256 decode/*.tiff | tee -a out/decode.txt
          {
            echo "darwin vs linux:   $(out/rawtest compare decode/darwin.tiff decode/linux.tiff)"
            echo "darwin vs windows: $(out/rawtest compare decode/darwin.tiff decode/windows.tiff)"
            echo "linux vs windows:  $(out/rawtest compare decode/linux.tiff decode/windows.tiff)"
          } | tee -a out/decode.txt | tee -a "$GITHUB_STEP_SUMMARY"
          go run ./ci/macos/decodegate decode/darwin.tiff decode/linux.tiff decode/windows.tiff | tee -a out/decode.txt
      - name: Checksums
        if: always()
        run: |
          mkdir -p out
          cp go-test-darwin*.log out/ 2>/dev/null || true
          cp third_party/libraw/lib/darwin_arm64/BUILDINFO.txt out/ 2>/dev/null || true
          (cd out && shasum -a 256 * > SHA256SUMS.txt; cat SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: w5-darwin-arm64-${{ matrix.os }}
          path: out
