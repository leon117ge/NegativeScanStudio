# Release gate for every macOS build (PLAN.md item W10): CJK scan of everything
# shipped, plain and consistent version numbers, bundle layout, arm64 slice,
# code signature, and docs/changelog entries.
#
# Call it from a build workflow as a local reusable workflow, in a job after
# the job that uploads the Mac artifact. This works on any branch:
#
#   checks:
#     needs: build
#     permissions: {contents: read, actions: read}
#     uses: ./.github/workflows/macos-build-checks.yml       # once merged, or:
#     # uses: leon117ge/NegativeScanStudio/.github/workflows/macos-build-checks.yml@qa/macos-parity
#     with:
#       artifact-name: NegativeScanStudio-ofx-macos-arm64
#       product: ofx
#       expected-version: ${{ needs.build.outputs.version }}   # for example 0.90.16
#
# Mode: 'auto' (default) reports on branch pushes and enforces (fails the job)
# when the calling ref is a release tag: refs/tags/v*, refs/tags/ofx-v* or
# refs/tags/print2383-v*. 'enforce' or 'report' overrides that.
# No version is hard-coded here: the caller passes expected-version.
# The docs/changelog check reads the caller's commit (or source-ref). The check
# scripts come from qa-ref (default qa/macos-parity), so a build branch does
# not need its own copy of ci/qa/.
# Test-only: no release, no tag, no secrets beyond the read-only GITHUB_TOKEN.
name: macOS build checks
on:
  workflow_call:
    inputs:
      artifact-name: {type: string, required: true, description: 'Artifact that holds the Mac build'}
      product: {type: string, required: true, description: 'ofx, print2383 or app'}
      expected-version: {type: string, required: false, default: '', description: 'Version the build must carry; empty = versions must only agree with each other'}
      run-id: {type: string, required: false, default: '', description: 'Run that uploaded the artifact; empty = the calling run'}
      mode: {type: string, required: false, default: 'auto', description: 'auto, report or enforce'}
      runner: {type: string, required: false, default: 'macos-15', description: 'macos-15 or macos-26'}
      source-ref: {type: string, required: false, default: '', description: 'Commit or branch whose docs/changelog are checked; empty = the calling commit'}
      qa-ref: {type: string, required: false, default: 'qa/macos-parity', description: 'Ref that holds ci/qa/ (the check scripts)'}
    outputs:
      result:
        description: 'PASS or FAIL'
        value: ${{ jobs.check.outputs.result }}
  workflow_dispatch:
    inputs:
      artifact-name: {description: 'Artifact name', required: true}
      run-id: {description: 'Workflow run that produced the Mac artifact', required: true}
      product: {description: 'ofx, print2383 or app', required: true, default: 'ofx'}
      expected-version: {description: 'Version the build must carry (empty = must only agree)', required: false, default: ''}
      mode: {description: 'auto, report or enforce', required: false, default: 'report'}
      runner: {description: 'macos-15 or macos-26', required: false, default: 'macos-15'}
      source-ref: {description: 'Commit or branch whose docs are checked (empty = this commit)', required: false, default: ''}
      qa-ref: {description: 'Ref that holds ci/qa/', required: false, default: 'qa/macos-parity'}
permissions:
  contents: read
  actions: read
jobs:
  check:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    outputs:
      result: ${{ steps.check.outputs.result }}
    env:
      RUN_ID: ${{ inputs.run-id }}
      ARTIFACT: ${{ inputs.artifact-name }}
      PRODUCT: ${{ inputs.product }}
      EXPECT: ${{ inputs.expected-version }}
      MODE_IN: ${{ inputs.mode || 'auto' }}
    steps:
      - name: Checkout the build's source (docs and changelog)
        uses: actions/checkout@v4
        with:
          path: src
          ref: ${{ inputs.source-ref }}
      - name: Checkout the QA scripts
        uses: actions/checkout@v4
        with:
          path: qa
          ref: ${{ inputs.qa-ref || 'qa/macos-parity' }}
          sparse-checkout: |
            ci/qa
            ofx/vendor/openfx/include
      - name: Download artifact from another run
        if: env.RUN_ID != ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: mac-artifact
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Download artifact from this run
        if: env.RUN_ID == ''
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: mac-artifact
      - name: Decide mode
        id: mode
        run: |
          mode="$MODE_IN"
          if [ "$mode" = auto ]; then
            case "$GITHUB_REF" in
              refs/tags/v*|refs/tags/ofx-v*|refs/tags/print2383-v*) mode=enforce ;;
              *) mode=report ;;
            esac
          fi
          case "$mode" in enforce|report) ;; *) echo "::error::mode must be auto, report or enforce"; exit 1 ;; esac
          echo "ref $GITHUB_REF -> $mode mode"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
      - name: OFX version probe (OfxGetPlugin)
        if: env.PRODUCT != 'app'
        run: |
          clang -arch arm64 -Iqa/ofx/vendor/openfx/include qa/ci/qa/ofx_version_probe.c -o probe
          : > probe.json
          find mac-artifact -path '*Contents/MacOS/*' -type f -name '*.ofx' | while read -r bin; do
            echo "probe: $bin"; ./probe "$bin" | tee -a probe.json
          done
          head -1 probe.json > probe1.json
      - name: codesign and architecture (macOS tools)
        run: |
          find mac-artifact -name '*.ofx.bundle' -o -name '*.app' | while read -r b; do
            echo "== $b"
            codesign --verify --deep --strict --verbose=2 "$b" 2>&1 || echo "::warning::codesign --verify failed for $b"
            codesign -dv --verbose=2 "$b" 2>&1 | grep -E 'Identifier|Signature|TeamIdentifier|flags' || true
          done
          find mac-artifact -type f | while read -r f; do
            if file "$f" | grep -q Mach-O; then file "$f"; lipo -archs "$f"; fi
          done
      - name: CJK, version, layout and docs checks
        id: check
        run: |
          echo "docs from $(git -C src rev-parse HEAD)"
          args=(mac-artifact --product "$PRODUCT" --repo src --report build-checks.json --mode "${{ steps.mode.outputs.mode }}")
          [ -n "$EXPECT" ] && args+=(--expect-version "$EXPECT")
          [ -s probe1.json ] && args+=(--probe probe1.json)
          set +e
          python3 qa/ci/qa/check_mac_build.py "${args[@]}"
          rc=$?
          set -e
          result=$(python3 -c "import json;print(json.load(open('build-checks.json'))['result'])")
          echo "result=$result" >> "$GITHUB_OUTPUT"
          if [ "$result" = FAIL ] && [ "${{ steps.mode.outputs.mode }}" = report ]; then
            echo "::warning::Mac build checks FAIL (report mode, not blocking). See the job summary."
          fi
          exit $rc
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mac-build-checks-${{ env.ARTIFACT }}-${{ inputs.expected-version || 'declared' }}-${{ github.run_attempt }}
          path: |
            build-checks.json
            probe.json
