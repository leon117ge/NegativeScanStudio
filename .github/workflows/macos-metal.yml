# Metal render path for the NSS OFX plugin on macOS Apple Silicon (W2).
# Not a release: the uploaded bundle is an ad-hoc signed test build.
name: macOS Metal
on:
  push:
    branches: [feat/metal-render, mac/integration]
  pull_request:
    paths: ['ofx/**', '.github/workflows/macos-metal.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metal:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    env:
      # Minimum macOS 13.0 everywhere (ofx/build-mac.sh, ofx/mac/Info.plist.in, check_mac_minos.py).
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CXXFLAGS_COMMON: -arch arm64 -mmacosx-version-min=13.0 -std=c++17 -O3 -fno-math-errno -fno-trapping-math -ffp-contract=off -fvisibility=hidden -Wall -Wextra -Wno-unused-parameter -Iofx/vendor/openfx/include -Iofx/vendor/opencl
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: uname -m; sw_vers; xcodebuild -version; clang++ --version
      - name: Generated sources are committed and in sync
        run: |
          python3 ofx/tools/generate.py && python3 ofx/tools/cuda_source.py
          git diff --exit-code -- ofx/src
      - name: Embedded Metal source matches render_math.h
        run: python3 ofx/tests/check_metal_source.py build/metal
      - name: No CJK characters in the Metal work
        run: |
          python3 - <<'PY'
          import pathlib,re,sys
          han=re.compile("[\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\U00020000-\U000323af]")
          files=[*pathlib.Path('ofx/src').glob('*metal*'),*pathlib.Path('ofx/src').glob('render.metal'),pathlib.Path('ofx/src/plugin.cpp'),
                 *pathlib.Path('ofx/tests').glob('metal*'),pathlib.Path('ofx/tests/param_dump.cpp'),pathlib.Path('ofx/tests/check_param_defs.py'),pathlib.Path('ofx/tests/check_release_hooks.py'),pathlib.Path('ofx/tests/check_mac_minos.py'),*pathlib.Path('ofx/tests/metal_stub').glob('*'),pathlib.Path('.github/workflows/macos-metal.yml'),
                 pathlib.Path('ofx/README.md'),pathlib.Path('ofx/CHANGELOG.md'),pathlib.Path('ofx/ROADMAP.md')]
          bad=[f'{f}:{n}' for f in files if f.is_file() for n,l in enumerate(f.read_text(encoding='utf-8').splitlines(),1) if han.search(l)]
          print('\n'.join(bad) or f'PASS: {len(files)} files, zero CJK characters');sys.exit(1 if bad else 0)
          PY
      - name: Offline compile of the embedded MSL (fast math off), as a lint
        run: |
          if ! xcrun -sdk macosx metal -v >/dev/null 2>&1; then xcodebuild -downloadComponent MetalToolchain || true; fi
          if xcrun -sdk macosx metal -v >/dev/null 2>&1; then
            xcrun -sdk macosx metal -fno-fast-math -c build/metal/nss_render.metal -o build/metal/nss_render.air
            xcrun -sdk macosx metallib build/metal/nss_render.air -o build/metal/nss_render.metallib && ls -l build/metal
          else
            echo "metal compiler not available on this image; runtime compile is still tested below"
          fi
      - name: Build NegativeScanStudio.ofx.bundle (arm64, Metal + CPU) with ofx/build-mac.sh
        run: |
          # Same script as the W1 CPU build and the release package: version-stamped Info.plist from
          # ofx/mac/Info.plist.in, licenses, ad-hoc signature, zip. NSS_METAL=1 requires Metal.
          set -o pipefail
          NSS_METAL=1 bash ofx/build-mac.sh build | tee build-mac.log
          grep -qx 'engine=Metal + CPU' build-mac.log
          B=build/NegativeScanStudio.ofx.bundle/Contents
          mkdir -p build/metal
          plutil -p "$B/Info.plist"
          file "$B/MacOS/NegativeScanStudio.ofx"
          nm -gU "$B/MacOS/NegativeScanStudio.ofx" | grep -E 'OfxGetPlugin|OfxGetNumberOfPlugins'
          otool -L "$B/MacOS/NegativeScanStudio.ofx" | tee build/otool.txt
          grep -q Metal.framework build/otool.txt
          python3 ofx/tests/check_release_hooks.py "$B/MacOS/NegativeScanStudio.ofx" build/obj/metal_render.o
          /usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$B/Info.plist" | tee build/minos-plist.txt
          grep -qx 13.0 build/minos-plist.txt
          otool -l "$B/MacOS/NegativeScanStudio.ofx" | tee build/otool-l.txt
          python3 ofx/tests/check_mac_minos.py build/otool-l.txt
      - name: Metal contract (mock API, exact kernel as host C++)
        run: |
          clang++ $CXXFLAGS_COMMON -Wno-unknown-attributes -Iofx/tests/metal_stub -Ibuild/metal ofx/tests/metal_contract.cpp -o build/metal/metal_contract
          build/metal/metal_contract
      - name: Rendering controls per platform (macOS visible, Windows/Linux variant unchanged)
        run: |
          clang++ $CXXFLAGS_COMMON -DNSS_RENDER_AUTO_METAL=1 ofx/tests/param_dump.cpp -o build/metal/param_dump_mac
          clang++ $CXXFLAGS_COMMON -DNSS_RENDER_AUTO_METAL=0 ofx/tests/param_dump.cpp -o build/metal/param_dump_mac_cpu
          clang++ $CXXFLAGS_COMMON -DNSS_MAC_RENDER_UI=0 ofx/tests/param_dump.cpp -o build/metal/param_dump_win_linux
          build/metal/param_dump_mac > build/metal/params_mac.txt
          build/metal/param_dump_mac_cpu > build/metal/params_mac_cpu.txt
          build/metal/param_dump_win_linux > build/metal/params_win_linux.txt
          python3 ofx/tests/check_param_defs.py build/metal/params_win_linux.txt build/metal/params_mac.txt build/metal/params_mac_cpu.txt
      - name: Real Metal parity and forced-failure fallback
        env:
          NSS_METAL_REQUIRE_DEVICE: '1'
        run: |
          clang++ $CXXFLAGS_COMMON -fobjc-arc -c ofx/tests/metal_test_support.mm -o build/obj/metal_test_support.o
          clang++ $CXXFLAGS_COMMON -fobjc-arc -DNSS_METAL -DNSS_TEST_HOOKS -c ofx/src/metal_render.mm -o build/obj/metal_render_hooks.o
          clang++ $CXXFLAGS_COMMON -DNSS_METAL -DNSS_TEST_HOOKS -c ofx/tests/metal_plugin_test.cpp -o build/obj/metal_plugin_test.o
          clang++ -arch arm64 -mmacosx-version-min=13.0 build/obj/metal_plugin_test.o build/obj/metal_render_hooks.o build/obj/metal_test_support.o \
            -framework Metal -framework Foundation -o build/metal/metal_plugin_test
          build/metal/metal_plugin_test | tee build/metal/parity.txt
      - name: Existing native unit tests (CPU-only build, unchanged)
        run: |
          for t in tone_test overlay_test metal_retry_test; do
            clang++ $CXXFLAGS_COMMON ofx/tests/$t.cpp -o build/metal/$t
            build/metal/$t
          done
          # CUDA and OpenCL are compiled out on macOS (ofx/src/platform.hpp); the mocked CUDA driver
          # contract turns them back on, exactly as macos-w1-ofx-cpu.yml does.
          clang++ $CXXFLAGS_COMMON -DNSS_WITH_CUDA=1 -DNSS_WITH_OPENCL=1 ofx/tests/cuda_contract.cpp -o build/metal/cuda_contract
          build/metal/cuda_contract
      - uses: actions/upload-artifact@v4
        with:
          name: NegativeScanStudio-ofx-macos-arm64-metal-${{ matrix.os }}
          path: |
            build/NegativeScanStudio.ofx.bundle
            build/NegativeScanStudio_OFX_v*_macOS_arm64.zip
            build/metal/parity.txt
